[Service]
# Node identity must live on /data. Root is a read-only overlay, so state under
# /var/lib/tailscale would be RAM-backed and lost every reboot, forcing a re-auth
# with a key that will have expired. Clearing ExecStart first is required -
# appending a second --state= flag and relying on which one wins is not a
# contract worth depending on.
ExecStart=
ExecStart=/usr/sbin/tailscaled --state=/data/tailscale/tailscaled.state --statedir=/data/tailscale --socket=/run/tailscale/tailscaled.sock --port=${PORT}
